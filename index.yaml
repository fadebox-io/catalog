# yaml-language-server: $schema=./schema/index.schema.json
apiVersion: fadebox.catalog/v1
name: Fadebox Official
entries:
  # Databases
  - slug: postgres
    name: PostgreSQL
    version: 1.0.0
    description: Single-node PostgreSQL 18 with healthcheck and persistent storage.
    tags: [ database ]
    path: postgres/template.yaml
  - slug: mysql
    name: MySQL
    version: 1.0.0
    description: Single-node MySQL 8.4 LTS with healthcheck and persistent storage — throwaway root/root, database `app` (mysql/mysql).
    tags: [ database ]
    path: mysql/template.yaml
  - slug: mariadb
    name: MariaDB
    version: 1.0.0
    description: Single-node MariaDB 11.8 LTS with healthcheck and persistent storage.
    tags: [ database ]
    path: mariadb/template.yaml
  - slug: mssql
    name: SQL Server
    version: 1.0.0
    description: SQL Server 2022 Developer edition — importing accepts Microsoft's EULA; throwaway SA password `Passw0rd!` (the image enforces complexity rules).
    tags: [ database ]
    path: mssql/template.yaml
  - slug: mongodb
    name: MongoDB
    version: 1.0.0
    description: Single-node MongoDB 8 with healthcheck and persistent storage — throwaway root user mongo/mongo.
    tags: [ database ]
    path: mongodb/template.yaml
  - slug: clickhouse
    name: ClickHouse
    version: 1.0.0
    description: ClickHouse 26.8 LTS single node with persistent storage — throwaway user default/clickhouse, native port 9000, HTTP interface on 8123 via ingress.
    tags: [ database ]
    path: clickhouse/template.yaml
  - slug: redis
    name: Redis
    version: 1.0.0
    description: Redis 7 with append-only persistence and healthcheck.
    tags: [ cache, database ]
    path: redis/template.yaml
  - slug: valkey
    name: Valkey
    version: 1.0.0
    description: Valkey 9 (the Redis fork) with append-only persistence and healthcheck — a drop-in Redis replacement on port 6379, no auth.
    tags: [ cache, database ]
    path: valkey/template.yaml
  - slug: memcached
    name: Memcached
    version: 1.0.0
    description: Memcached 1.6 with 64 MB of cache on port 11211, no auth.
    tags: [ cache ]
    path: memcached/template.yaml
  # Messaging
  - slug: rabbitmq
    name: RabbitMQ
    version: 1.0.0
    description: RabbitMQ 4 with the management UI exposed via ingress.
    tags: [ messaging ]
    path: rabbitmq/template.yaml
  - slug: kafka
    name: Apache Kafka
    version: 1.0.0
    description: Apache Kafka 3.9 in single-node KRaft mode with persistent storage — add under the service name `kafka`, which its advertised listener hardcodes.
    tags: [ messaging ]
    path: kafka/template.yaml
  - slug: nats
    name: NATS
    version: 1.0.0
    description: NATS 2.14 single node with JetStream persistence — clients on 4222, no auth; monitoring page via ingress.
    tags: [ messaging ]
    path: nats/template.yaml
  # Auth
  - slug: keycloak
    name: Keycloak
    version: 1.0.0
    description: Keycloak 26 in dev mode (throwaway admin/admin), UI via ingress.
    tags: [ auth ]
    path: keycloak/template.yaml
  - slug: keycloak-postgres
    name: Keycloak (PostgreSQL)
    version: 1.0.0
    description: Keycloak 26 in dev mode (throwaway admin/admin) backed by PostgreSQL — pair with the PostgreSQL template, UI via ingress.
    tags: [ auth ]
    requires: [ postgres ]
    path: keycloak-postgres/template.yaml
  # Search & storage
  - slug: opensearch
    name: OpenSearch
    version: 1.0.0
    description: Single-node OpenSearch 2 with the security plugin disabled and a 512 MB heap — the host needs vm.max_map_count ≥ 262144.
    tags: [ search ]
    path: opensearch/template.yaml
  - slug: elasticsearch
    name: Elasticsearch
    version: 1.0.0
    description: Single-node Elasticsearch 8 with security disabled and a 512 MB heap — the host needs vm.max_map_count ≥ 262144.
    tags: [ search ]
    path: elasticsearch/template.yaml
  - slug: minio
    name: MinIO
    version: 1.0.0
    description: S3-compatible object storage with persistent data (throwaway minioadmin/minioadmin), console UI via ingress, S3 API on port 9000.
    tags: [ storage ]
    path: minio/template.yaml
  # Cloud emulators
  - slug: localstack
    name: LocalStack
    version: 1.0.0
    description: AWS API emulator (S3, SQS, SNS, DynamoDB, …) on port 4566 via ingress — compute services need the host Docker socket and are not available.
    tags: [ emulator, testing ]
    path: localstack/template.yaml
  - slug: azurite
    name: Azurite
    version: 1.0.0
    description: Azure Storage emulator (blob 10000, queue 10001, table 10002) with the standard devstoreaccount1 account and persistent storage.
    tags: [ emulator, testing ]
    path: azurite/template.yaml
  # Observability
  - slug: prometheus
    name: Prometheus
    version: 1.0.0
    description: Prometheus 3 with persistent storage and the UI via ingress — scrapes itself out of the box; add your targets in the injected prometheus.yml.
    tags: [ observability ]
    path: prometheus/template.yaml
  - slug: grafana
    name: Grafana
    version: 1.0.0
    description: Grafana 13 with a provisioned Prometheus data source — pair with the Prometheus template; throwaway admin/admin, UI via ingress.
    tags: [ observability ]
    requires: [ prometheus ]
    path: grafana/template.yaml
  - slug: jaeger
    name: Jaeger
    version: 1.0.0
    description: Jaeger 2 all-in-one with in-memory storage — send traces over OTLP to 4317 (gRPC) or 4318 (HTTP); UI via ingress.
    tags: [ observability ]
    path: jaeger/template.yaml
  # Dev tools
  - slug: wiremock
    name: WireMock
    version: 1.0.0
    description: HTTP mock server for stubbing third-party APIs — admin API and stubs via ingress.
    tags: [ mock, testing ]
    path: wiremock/template.yaml
  - slug: pgadmin
    name: pgAdmin
    version: 1.0.0
    description: pgAdmin 4 web UI via ingress (throwaway admin@example.com/admin) — pair with the PostgreSQL template, whose server is pre-registered and connects without a password prompt.
    tags: [ database, tools ]
    requires: [ postgres ]
    path: pgadmin/template.yaml
  - slug: mailpit
    name: Mailpit
    version: 1.0.0
    description: SMTP sink with a web inbox via ingress — for testing outgoing mail.
    tags: [ mail, testing ]
    path: mailpit/template.yaml
  - slug: whoami
    name: Whoami (demo)
    version: 1.0.0
    description: Tiny HTTP echo service — handy for verifying ingress and routing.
    tags: [ demo ]
    path: whoami/template.yaml
