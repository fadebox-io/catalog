slug: keycloak-postgres
name: Keycloak (PostgreSQL)
version: 1.0.0
description: Keycloak 26 in dev mode (throwaway admin/admin) backed by PostgreSQL — pair with the PostgreSQL template, UI via ingress.
spec: |
  services:
    keycloak:
      image: quay.io/keycloak/keycloak:26.7
      command: ["start-dev"]
      environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        KC_PROXY_HEADERS: xforwarded
        KC_HTTP_ENABLED: "true"
        KC_HEALTH_ENABLED: "true"
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://{{service.postgres.host}}:5432/{{service.postgres.env.POSTGRES_DB}}
        KC_DB_USERNAME: "{{service.postgres.env.POSTGRES_USER}}"
        KC_DB_PASSWORD: "{{service.postgres.env.POSTGRES_PASSWORD}}"
      labels:
        fadebox.ingress.port: "8080"
      healthcheck:
        test: [ "CMD-SHELL", "[ -f /tmp/HealthCheck.java ] || echo \"public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }\" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live" ]
        start_period: 30s
        interval: 10s
        timeout: 10s
        retries: 30
