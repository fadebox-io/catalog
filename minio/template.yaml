slug: minio
name: MinIO
version: 1.0.0
description: S3-compatible object storage with persistent data (throwaway minioadmin/minioadmin), console UI via ingress, S3 API on port 9000.
spec: |
  services:
    minio:
      image: quay.io/minio/minio:latest
      command: [ "server", "--console-address", ":9001", "/data" ]
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      labels:
        fadebox.ingress.port: "9001"
      ports:
        - "9000"
      volumes:
        - minio-data:/data
      healthcheck:
        test: [ "CMD", "curl", "-sf", "http://localhost:9000/minio/health/live" ]
        start_period: 10s
        interval: 5s
        timeout: 5s
        retries: 12
