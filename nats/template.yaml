slug: nats
name: NATS
version: 1.0.0
description: NATS 2.14 single node with JetStream persistence — clients on 4222, no auth; monitoring page via ingress.
spec: |
  services:
    nats:
      image: nats:2.14-alpine
      command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
      ports:
        - "4222"
      volumes:
        - nats-data:/data
      labels:
        fadebox.ingress.port: "8222"
      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
        interval: 5s
        timeout: 3s
        retries: 10
