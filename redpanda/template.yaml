slug: redpanda
name: Redpanda
version: 1.0.0
description: Redpanda 26 single node, Kafka-compatible on 9092 with persistent storage — add under the service name `redpanda`, which its advertised listener hardcodes.
spec: |
  services:
    redpanda:
      image: redpandadata/redpanda:v26.2.2
      command:
        - redpanda
        - start
        - --mode
        - dev-container
        - --smp
        - "1"
        - --memory
        - 1G
        - --overprovisioned
        - --kafka-addr
        - internal://0.0.0.0:9092
        - --advertise-kafka-addr
        - internal://redpanda:9092
      mem_limit: 1536m
      ports:
        - "9092"
      volumes:
        - redpanda-data:/var/lib/redpanda/data
      healthcheck:
        test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
        start_period: 20s
        interval: 10s
        timeout: 10s
        retries: 12
