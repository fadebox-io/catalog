slug: kafka
name: Apache Kafka
version: 1.0.0
description: Apache Kafka 3.9 in single-node KRaft mode with persistent storage — add under the service name `kafka`, which its advertised listener hardcodes.
spec: |
  services:
    kafka:
      image: apache/kafka:3.9.1
      environment:
        CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        KAFKA_LOG_DIRS: /var/lib/kafka/data
      mem_limit: 1g
      volumes:
        - kafka-data:/var/lib/kafka/data
      depends_on:
        kafka-init:
          condition: service_completed_successfully
      healthcheck:
        test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
        start_period: 30s
        interval: 10s
        timeout: 10s
        retries: 12
    # The image runs as uid 1000, but a fresh named volume is root-owned — hand it over first.
    kafka-init:
      image: busybox:1.37
      labels:
        fadebox.role: init
      command: [ "chown", "-R", "1000:1000", "/var/lib/kafka/data" ]
      volumes:
        - kafka-data:/var/lib/kafka/data
