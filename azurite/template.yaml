slug: azurite
name: Azurite
version: 1.0.0
description: Azure Storage emulator (blob 10000, queue 10001, table 10002) with the standard devstoreaccount1 account and persistent storage.
spec: |
  services:
    azurite:
      image: mcr.microsoft.com/azure-storage/azurite:3.33.0
      ports:
        - "10000"
        - "10001"
        - "10002"
      volumes:
        - azurite-data:/data
      healthcheck:
        test: [ "CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:10000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
        start_period: 10s
        interval: 5s
        timeout: 5s
        retries: 12
