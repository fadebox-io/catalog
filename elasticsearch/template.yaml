slug: elasticsearch
name: Elasticsearch
version: 1.0.0
description: Single-node Elasticsearch 8 with security disabled and a 512 MB heap — the host needs vm.max_map_count ≥ 262144.
spec: |
  services:
    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
      environment:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
      mem_limit: 1g
      volumes:
        - elasticsearch-data:/usr/share/elasticsearch/data
      healthcheck:
        test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health" ]
        start_period: 30s
        interval: 10s
        timeout: 5s
        retries: 12
