slug: redis
name: Redis
version: 1.0.0
description: Redis 7 with append-only persistence and healthcheck.
spec: |
  services:
    redis:
      image: redis:7-alpine
      command: ["redis-server", "--appendonly", "yes"]
      ports:
        - "6379"
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10
